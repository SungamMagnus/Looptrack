<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looptrack — web prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lt-app">
  <div class="lt-topbar">
    <div class="lt-transport" id="transport">
      <div class="lt-terminal-inline"></div>
      <button id="btnEnable">Enable Audio</button>
      <button id="btnPlay" disabled>Play</button>
      <input type="number" id="bpmInput" value="120" min="40" max="240" disabled>
      <span style="font-size:8px;color:var(--ink-45)">BPM</span>
    </div>
    <div class="lt-topbar-tag">4-track cassette emulation — track 1 is live, 2–4 are mockup</div>
    <div style="width:60px"></div>
  </div>
  <div class="lt-body" id="ltBody"></div>
  <div class="lt-status" id="statusLine">Click "Enable Audio" to grant microphone access and start the engine.</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
